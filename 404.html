<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Halaman Tidak Ditemukan — 404 — Saturasi Wearhouse</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --black: #0F0F0F;
      --white: #FFFFFF;
      --off-white: #F9F9FB;
      --light-gray: #F4F4F5;
      --mid-gray: #71717A;
      --border: rgba(27, 117, 187, 0.08);
      --accent: #1b75bb;
      --radius: 24px;
      --radius-sm: 12px;
      --font-head: 'Montserrat', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-head);
      background: var(--off-white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* ── CUSTOM SELECTION & SCROLLBAR ── */
    ::selection {
      background: var(--accent);
      color: var(--white);
    }

    @media(pointer:fine) {
      * {
        cursor: none !important;
      }
    }

    /* Cursor elements */
    #cur-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      position: fixed;
      transform: translate(-50%,-50%);
      pointer-events: none;
      z-index: 10000;
      transition: transform .1s, background .3s;
    }

    #cur-ring {
      width: 38px;
      height: 38px;
      border: 1.5px solid rgba(27, 117, 187, .3);
      border-radius: 50%;
      position: fixed;
      transform: translate(-50%,-50%);
      pointer-events: none;
      z-index: 9999;
      transition: width .3s, height .3s, border-color .3s;
    }

    /* Background Blue Glow */
    .glow-bg {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(27, 117, 187, 0.08) 0%, rgba(255, 255, 255, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
      pointer-events: none;
    }

    /* Grid Overlay */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(27, 117, 187, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(27, 117, 187, 0.02) 1px, transparent 1px);
      background-size: 45px 45px;
      background-position: center center;
      z-index: 2;
      pointer-events: none;
    }

    /* Floating Decorative Elements */
    .floating-el {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      animation: floatElements 6s ease-in-out infinite;
    }

    /* Main Container */
    .error-card {
      position: relative;
      z-index: 3;
      max-width: 580px;
      width: 90%;
      background: rgba(255, 255, 255, 0.65);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 60px 40px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(27, 117, 187, 0.06);
      transition: all 0.4s ease;
      animation: fadeInUp 1s cubic-bezier(0.23, 1, 0.32, 1) both;
    }

    .error-card:hover {
      border-color: rgba(27, 117, 187, 0.2);
      box-shadow: 0 40px 80px rgba(27, 117, 187, 0.12);
    }

    /* Hanger SVG animation */
    .error-svg-wrapper {
      margin-bottom: 30px;
      display: inline-flex;
      position: relative;
      animation: float 4s ease-in-out infinite;
    }

    .error-svg {
      color: rgba(27, 117, 187, 0.25);
      transition: color 0.4s ease, transform 0.4s ease;
    }

    .error-card:hover .error-svg {
      color: var(--accent);
      transform: scale(1.05);
    }

    .error-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(27, 117, 187, 0.07);
      color: var(--accent);
      padding: 6px 14px;
      font-size: 0.72rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border-radius: 20px;
      margin-bottom: 24px;
    }

    /* 404 Large Text */
    .error-num {
      font-size: 5rem;
      font-weight: 850;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(180deg, var(--black) 30%, var(--mid-gray) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .error-tag {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }

    .error-h2 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      color: var(--black);
    }

    .error-desc {
      font-size: 0.9rem;
      line-height: 1.8;
      color: var(--mid-gray);
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* Button Styling */
    .btn-group-404 {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
    }

    .btn-404-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--white);
      border: 1px solid var(--accent);
      padding: 14px 28px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 30px;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      text-decoration: none !important;
    }

    .btn-404-primary:hover {
      background: var(--black);
      border-color: var(--black);
      color: var(--white);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .btn-404-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--accent);
      border: 1px solid rgba(27, 117, 187, 0.25);
      padding: 14px 28px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 30px;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      text-decoration: none !important;
    }

    .btn-404-secondary:hover {
      background: rgba(27, 117, 187, 0.05);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    /* Keyframes */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes floatElements {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-15px) rotate(3deg);
      }
    }

    @media (max-width: 576px) {
      .error-card {
        padding: 45px 24px;
      }
      .error-num {
        font-size: 4rem;
      }
      .error-h2 {
        font-size: 1.3rem;
      }
      .btn-group-404 {
        flex-direction: column;
        width: 100%;
        gap: 12px;
      }
      .btn-404-primary, .btn-404-secondary {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <!-- Background visual patterns -->
  <div class="glow-bg"></div>
  <div class="grid-bg"></div>

  <!-- Floating Design Elements (Convection Outline Icons) -->
  <!-- 1. Scissors -->
  <svg class="floating-el" style="top: 15%; left: 12%; animation-delay: 0s;" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(27, 117, 187, 0.12)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3"/>
    <circle cx="6" cy="18" r="3"/>
    <line x1="20" y1="4" x2="8.12" y2="15.88"/>
    <line x1="14.47" y1="14.48" x2="20" y2="20"/>
    <line x1="8.12" y1="8.12" x2="12" y2="12"/>
  </svg>

  <!-- 2. Sewing Needle -->
  <svg class="floating-el" style="bottom: 18%; right: 14%; animation-delay: 2s;" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(27, 117, 187, 0.12)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="5" y1="19" x2="19" y2="5"/>
    <circle cx="19" cy="5" r="1"/>
    <path d="M19 5a2 2 0 0 1-2 2"/>
  </svg>

  <!-- 3. T-shirt pattern outline -->
  <svg class="floating-el" style="top: 22%; right: 12%; animation-delay: 4s;" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="rgba(27, 117, 187, 0.12)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 3h6v4l-3 1v13H6V8l-3-1V3h6a3 3 0 0 1 6 0z"/>
  </svg>

  <!-- Error Card -->
  <div class="error-card">
    <div class="error-svg-wrapper">
      <!-- Tailored Outline Clothing Hanger SVG -->
      <svg class="error-svg" width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 1 3 3c0 .8-.5 1.5-1.2 1.8L22 17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2l8.2-10.2C9.5 6.5 9 5.8 9 5a3 3 0 0 1 3-3z"/>
        <line x1="2" y1="17" x2="22" y2="17" stroke-dasharray="2 2" stroke-width="1"/>
      </svg>
    </div>
    
    <div>
      <span class="error-badge">Error 404</span>
    </div>
    <div class="error-num">404</div>
    <h2 class="error-h2">Halaman Tidak Ditemukan</h2>
    <p class="error-desc">
      Maaf, halaman yang Anda cari tidak dapat ditemukan atau telah dihapus. Silakan kembali ke beranda atau hubungi layanan pelanggan kami via WhatsApp.
    </p>

    <div class="btn-group-404">
      <a href="/" class="btn-404-primary">Kembali Ke Beranda</a>
      <a href="https://wa.me/62895347150703" target="_blank" class="btn-404-secondary">Hubungi Kami <i class="bi bi-whatsapp ms-2"></i></a>
    </div>
  </div>

  <script>
    /* Custom Brand Cursor alignment */
    const dot = document.getElementById('cur-dot'), ring = document.getElementById('cur-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', e => { 
      mx = e.clientX; 
      my = e.clientY; 
      dot.style.left = mx + 'px'; 
      dot.style.top = my + 'px';
    });
    
    (function tick() { 
      rx += (mx - rx) * .13; 
      ry += (my - ry) * .13; 
      ring.style.left = rx + 'px'; 
      ring.style.top = ry + 'px'; 
      requestAnimationFrame(tick); 
    })();

    document.querySelectorAll('.btn-404-primary, .btn-404-secondary, .error-card').forEach(el => {
      el.addEventListener('mouseenter', () => {
        dot.style.transform = 'translate(-50%,-50%) scale(2.2)';
        dot.style.background = 'rgba(27, 117, 187, .25)';
        ring.style.width = ring.style.height = '58px';
        ring.style.borderColor = '#1b75bb';
      });
      el.addEventListener('mouseleave', () => {
        dot.style.transform = 'translate(-50%,-50%) scale(1)';
        dot.style.background = '#1b75bb';
        ring.style.width = ring.style.height = '38px';
        ring.style.borderColor = 'rgba(27, 117, 187, .2)';
      });
    });
  </script>
</body>

</html>
